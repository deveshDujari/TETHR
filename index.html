<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tethr - A Quieter Place</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="landing-screen" class="container">
    <div class="logo">T E T H R</div>
    <p class="tagline">A QUIETER PLACE</p>
    <h1>Welcome to Tethr.</h1>
    <p class="subtext">The world is loud.<br>You don't have to be.</p>

    <!-- Changed anchor tag to button to prevent page reload issues -->
    <button type="button" id="enter-btn" class="enter-button">ENTER</button>

    <p class="footer-note">No account. No score. No need to stay.</p>
  </div>

  <div id="app-screen" class="container hidden">
    <div class="logo">T E T H R</div>
    <div id="chat-output" class="chat-container"></div>
    <div class="input-container">
      <input type="text" id="user-input" placeholder="Type your thought..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
